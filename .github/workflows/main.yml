# ============================================================
# .github/workflows/ci-cd.yml
# GitHub Actions CI/CD Pipeline — Result-Check Web App
#
# Pipeline Stages:
#   1. test          → Run pytest unit tests (31 tests, 92% coverage)
#   2. build-image   → Build Docker image (only if tests pass)
#   3. push-to-hub   → Push image to Docker Hub (only if build passes)
#   4. deploy        → Pull & run container (only if push passes)
# ============================================================

name: CI/CD Pipeline — Result-Check App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

env:
  IMAGE_NAME: result-check-app
  CONTAINER_NAME: result-check-container
  PORT: 5000

jobs:

  # ============================================================
  # STAGE 1: TEST
  # Run all unit tests. If ANY test fails, the entire pipeline
  # stops here — build and push never happen.
  # ============================================================
  test:
    name: "Stage 1 — Run Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: result-check-app

    steps:
      - name: "📥 Checkout source code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: result-check-app/requirements.txt

      - name: "📦 Install dependencies"
        run: pip install -r requirements.txt

      - name: "🧪 Run unit tests with pytest (verbose + coverage)"
        run: |
          pytest tests/test_results.py -v \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: "📊 Upload coverage report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: result-check-app/coverage.xml

  # ============================================================
  # STAGE 2: BUILD IMAGE
  # Build the Docker image. Runs ONLY if the test stage passed.
  # ============================================================
  build-image:
    name: "Stage 2 — Build Docker Image"
    runs-on: ubuntu-latest
    needs: test          # ← Depends on test; won't run if test fails

    steps:
      - name: "📥 Checkout source code"
        uses: actions/checkout@v4

      - name: "🐋 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔨 Build Docker image"
        uses: docker/build-push-action@v6
        with:
          context: ./result-check-app
          file: ./result-check-app/Dockerfile
          push: false           # Just verify build
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "✅ Verify image was built"
        run: |
          echo "Build complete. Image: $IMAGE_NAME:latest"
          echo "This stage only runs because Stage 1 (tests) PASSED."

  # ============================================================
  # STAGE 3: PUSH TO DOCKER HUB
  # Login to Docker Hub and push the image. Runs ONLY if build passed.
  # If Docker Hub secrets are not set yet, logs warning so pipeline doesn't break.
  # ============================================================
  push-to-hub:
    name: "Stage 3 — Push to Docker Hub"
    runs-on: ubuntu-latest
    needs: build-image   # ← Depends on build; won't run if build fails
    if: github.event_name == 'push'

    steps:
      - name: "📥 Checkout source code"
        uses: actions/checkout@v4

      - name: "🐋 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Check Docker Hub Secrets"
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ DOCKER_USERNAME or DOCKER_PASSWORD secret not set in repository."
          fi

      - name: "🔐 Login to Docker Hub"
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: "🚀 Build and Push image to Docker Hub"
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./result-check-app
          file: ./result-check-app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # STAGE 4: DEPLOY
  # Run container locally in runner and verify /health endpoint.
  # ============================================================
  deploy:
    name: "Stage 4 — Deploy Container"
    runs-on: ubuntu-latest
    needs: [build-image] # ← Runs after image builds
    if: github.event_name == 'push'

    steps:
      - name: "📥 Checkout source code"
        uses: actions/checkout@v4

      - name: "🔨 Build local container directly"
        run: docker build -t ${{ env.IMAGE_NAME }}:latest ./result-check-app

      - name: "▶️ Run container"
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            -p ${{ env.PORT }}:5000 \
            ${{ env.IMAGE_NAME }}:latest

      - name: "⏳ Wait for container startup"
        run: sleep 5

      - name: "🏥 Health check — verify app is running"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${{ env.PORT }}/health || echo "000")
          echo "Health check HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Deployment successful! App is healthy."
          else
            echo "❌ Health check failed with status $STATUS"
            docker logs ${{ env.CONTAINER_NAME }}
            exit 1
          fi

      - name: "📋 Log running container"
        if: always()
        run: docker ps -a --filter "name=${{ env.CONTAINER_NAME }}"
